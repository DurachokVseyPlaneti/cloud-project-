<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои задачи</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 0 12px;
    }

    input, button {
      padding: 10px;
      margin: 4px 0;
      font-size: 15px;
      box-sizing: border-box;
    }

    input {
      width: 100%;
    }

    button {
      cursor: pointer;
    }

    li {
      margin: 8px 0;
    }

    #warning, #message {
      display: none;
      padding: 10px;
      border-radius: 6px;
      margin: 10px 0;
    }

    #warning {
      background: #ffe5e5;
      color: #a00;
    }

    #message {
      background: #e8f4ff;
      color: #155080;
    }

    .auth-buttons {
      display: flex;
      gap: 8px;
    }

    .auth-buttons button {
      flex: 1;
    }

    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>

<body>

  <h1>Мои задачи</h1>

  <div id="warning">
    Необходимо настроить Supabase URL и Publishable Key.
  </div>

  <div id="message"></div>

  <!-- АВТОРИЗАЦИЯ -->
  <div id="auth">

    <h2>Вход в аккаунт</h2>

    <input
      id="email"
      type="email"
      placeholder="Электронная почта"
      autocomplete="email"
      required
    >

    <input
      id="password"
      type="password"
      placeholder="Пароль (от 6 символов)"
      autocomplete="current-password"
      minlength="6"
      required
    >

    <div class="auth-buttons">
      <button type="button" onclick="signUp()">
        Регистрация
      </button>

      <button type="button" onclick="signIn()">
        Войти
      </button>
    </div>

  </div>

  <!-- ПРИЛОЖЕНИЕ -->
  <div id="app" style="display:none">

    <h2>Мой аккаунт</h2>

    <p>
      Вы вошли как:
      <strong id="who"></strong>
    </p>

    <button onclick="signOut()">Выйти</button>

    <hr>

    <h2>Мои задачи</h2>

    <input
      id="task"
      type="text"
      placeholder="Введите новую задачу"
    >

    <button onclick="addTask()">Добавить задачу</button>

    <ul id="list"></ul>

    <hr>

    <h2>Статистика</h2>

    <button onclick="loadStats()">Получить статистику</button>

    <p id="stats"></p>

    <hr>

    <h2>Проверка сервера</h2>

    <input
      id="echoText"
      placeholder="Что отправить на сервер"
    >

    <button onclick="sendEcho()">Отправить</button>

    <p id="echoResult"></p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    // ==========================================
    // 1. НАСТРОЙКИ SUPABASE
    // ==========================================

    const SUPABASE_URL =
      "https://mlzsedfprpynolckfzpl.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_CbXdE_7zh6Dt1nLrNZLoMg_YuiUPKcq;

    const BACKEND_URL =
      "https://backend-elizavetapetruhan1.msk1.amvera.tech";

    const warning = document.getElementById("warning");
    const message = document.getElementById("message");

    if (
      !SUPABASE_URL.startsWith("https://") ||
      !SUPABASE_KEY.startsWith("sb_publishable_")
    ) {
      warning.style.display = "block";
      throw new Error("Проверь настройки Supabase");
    }

    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // ==========================================
    // 2. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ==========================================

    function showMessage(text) {
      message.textContent = text;
      message.style.display = "block";
    }

    function hideMessage() {
      message.style.display = "none";
    }

    function getCredentials() {
      return {
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      };
    }

    function validateCredentials(email, password) {
      if (!email || !email.includes("@")) {
        showMessage("Введите корректную электронную почту");
        return false;
      }

      if (password.length < 6) {
        showMessage("Пароль должен содержать минимум 6 символов");
        return false;
      }

      return true;
    }


    // ==========================================
    // 3. РЕГИСТРАЦИЯ
    // ==========================================

    async function signUp() {
      hideMessage();

      const { email, password } = getCredentials();

      if (!validateCredentials(email, password)) {
        return;
      }

      try {
        const { data, error } = await db.auth.signUp({
          email,
          password
        });

        if (error) {
          showMessage("Ошибка регистрации: " + error.message);
          return;
        }

        if (data.session) {
          showMessage("Регистрация успешна!");
        } else {
          showMessage(
            "Аккаунт создан! Проверь почту и подтверди регистрацию. Затем войди в аккаунт."
          );
        }

      } catch (error) {
        showMessage("Ошибка соединения: " + error.message);
      }
    }


    // ==========================================
    // 4. ВХОД
    // ==========================================

    async function signIn() {
      hideMessage();

      const { email, password } = getCredentials();

      if (!validateCredentials(email, password)) {
        return;
      }

      try {
        const { error } = await db.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          showMessage("Ошибка входа: " + error.message);
          return;
        }

        showMessage("Вы успешно вошли!");

      } catch (error) {
        showMessage("Ошибка соединения: " + error.message);
      }
    }


    // ==========================================
    // 5. ВЫХОД
    // ==========================================

    async function signOut() {
      hideMessage();

      const { error } = await db.auth.signOut();

      if (error) {
        showMessage("Ошибка выхода: " + error.message);
        return;
      }

      showMessage("Вы вышли из аккаунта");
    }


    // ==========================================
    // 6. ОТОБРАЖЕНИЕ ПРИЛОЖЕНИЯ
    // ==========================================

    function showApp(user) {
      document.getElementById("auth").style.display = "none";
      document.getElementById("app").style.display = "block";

      document.getElementById("who").textContent = user.email;

      hideMessage();
      loadTasks();
    }

    function showAuth() {
      document.getElementById("auth").style.display = "block";
      document.getElementById("app").style.display = "none";
    }


    // ==========================================
    // 7. ВОССТАНОВЛЕНИЕ СЕССИИ
    // ==========================================

    db.auth.onAuthStateChange((event, session) => {

      if (session && session.user) {
        document.getElementById("auth").style.display = "none";
        document.getElementById("app").style.display = "block";
        document.getElementById("who").textContent =
          session.user.email;

        // Не выполняем запросы Supabase непосредственно
        // внутри callback авторизации.
        setTimeout(() => loadTasks(), 0);

      } else {
        showAuth();
        document.getElementById("list").innerHTML = "";
      }

    });

    async function checkSession() {
      const { data, error } = await db.auth.getSession();

      if (error) {
        showMessage("Не удалось проверить сессию: " + error.message);
        return;
      }

      if (data.session) {
        showApp(data.session.user);
      } else {
        showAuth();
      }
    }


    // ==========================================
    // 8. ЗАГРУЗКА ЗАДАЧ
    // ==========================================

    async function loadTasks() {
      const { data, error } = await db
        .from("tasks")
        .select("*")
        .order("id");

      if (error) {
        showMessage("Ошибка загрузки задач: " + error.message);
        return;
      }

      const list = document.getElementById("list");

      list.innerHTML = "";

      for (const task of data) {

        const li = document.createElement("li");
        li.className = "task-item";

        const title = document.createElement("span");
        title.textContent = task.title;

        const button = document.createElement("button");
        button.textContent = "Удалить";

        button.onclick = () => deleteTask(task.id);

        li.appendChild(title);
        li.appendChild(button);

        list.appendChild(li);
      }
    }


    // ==========================================
    // 9. ДОБАВЛЕНИЕ ЗАДАЧ
    // ==========================================

    async function addTask() {
      const title = document
        .getElementById("task")
        .value.trim();

      if (!title) {
        showMessage("Введите текст задачи");
        return;
      }

      const { data: { user }, error: userError } =
        await db.auth.getUser();

      if (userError || !user) {
        showMessage("Необходимо войти в аккаунт");
        return;
      }

      const { error } = await db
        .from("tasks")
        .insert({
          title: title,
          user_id: user.id
        });

      if (error) {
        showMessage("Ошибка добавления: " + error.message);
        return;
      }

      document.getElementById("task").value = "";

      hideMessage();

      await loadTasks();
    }


    // ==========================================
    // 10. УДАЛЕНИЕ ЗАДАЧ
    // ==========================================

    async function deleteTask(id) {

      const { error } = await db
        .from("tasks")
        .delete()
        .eq("id", id);

      if (error) {
        showMessage("Ошибка удаления: " + error.message);
        return;
      }

      await loadTasks();
    }


    // ==========================================
    // 11. СТАТИСТИКА
    // ==========================================

    async function loadStats() {
      const stats = document.getElementById("stats");

      stats.textContent = "Загрузка...";

      try {
        const response = await fetch(
          BACKEND_URL + "/stats"
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Ошибка сервера");
        }

        stats.textContent =
          "Всего задач в базе: " + data.total_tasks;

      } catch (error) {
        stats.textContent =
          "Ошибка получения статистики: " + error.message;
      }
    }


    // ==========================================
    // 12. ОТПРАВКА ДАННЫХ НА BACKEND
    // ==========================================

    async function sendEcho() {

      const text = document
        .getElementById("echoText")
        .value;

      try {
        const response = await fetch(
          BACKEND_URL + "/echo",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ text })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Ошибка сервера");
        }

        document.getElementById("echoResult").textContent =
          JSON.stringify(data);

      } catch (error) {
        document.getElementById("echoResult").textContent =
          "Ошибка: " + error.message;
      }
    }


    // ==========================================
    // 13. ЗАПУСК
    // ==========================================

    checkSession();

  </script>

</body>
</html>
